# Nginx site configuration for NAVISH ARC frontend
# Prevents index.html browser caching while aggressively caching hashed static assets

server {
    listen 80;
    listen [::]:80;
    server_name navish-arc.site;

    root /home/ubuntu/frontend/dist; # Replace with your actual frontend dist folder path
    index index.html;

    # 1. Never cache index.html (ensures browsers always fetch the newest build entry point)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 2. Aggressively cache static assets with hashed filenames
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
